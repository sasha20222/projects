<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Магазин Оцінок</h1>
    <div class="shelf">
        <div class="card">
            <h2>Оцінка по інформатиці</h2>
            <p>Ціна: $15</p>
            <button onclick="buy(15)">Купити</button>
        </div>
        <div class="card">
            <h2>Оцінка по фізиці</h2>
            <p>Ціна: $20</p>
            <button onclick="buy(20)">Купити</button>
        </div>
        <div class="card">
            <h2>Оцінка по алгебрі</h2>
            <p>Ціна: $23</p>
            <button onclick="buy(23)">Купити</button>
        </div>
    </div>
    <button onclick="wallet()">Гаманець</button>
    <script src="scripts.js"></script>
</body>

</html>
