<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Загальна вікторина від Саши</h1>

    <h2 id="question1">Як звали першу династію Китаю?</h2>
    <button id="option1-1" class="wrong-btn">Чингісхан</button>
    <button id="option1-2" class="right-btn">Цінь</button>
    <button id="option1-3" class="wrong-btn">Шін</button>

    <h2 id="question2">Яка столиця Франції?</h2>
    <button id="option2-1" class="wrong-btn">Берлін</button>
    <button id="option2-2" class="right-btn">Париж</button>
    <button id="option2-3" class="wrong-btn">Мадрид</button>

    <h2 id="question3">Яка планета найбільша в Сонячній системі?</h2>
    <button id="option3-1" class="wrong-btn">Земля</button>
    <button id="option3-2" class="right-btn">Юпітер</button>
    <button id="option3-3" class="wrong-btn">Сатурн</button>

    <h2 id="question4">Скільки уроків у 7б класі? (побег не рахуємо)</h2>
    <button id="option4-1" class="wrong-btn">5</button>
    <button id="option4-2" class="right-btn">6</button>
    <button id="option4-3" class="wrong-btn">7</button>

    <h2 id="question5">Яка столиця України?</h2>
    <button id="option5-1" class="right-btn">Київ</button>
    <button id="option5-2" class="wrong-btn">Львів</button>
    <button id="option5-3" class="wrong-btn">Одеса</button>

    <p id="result"></p>
    <p id="score">Рахунок: 0</p>

    <script src="script.js"></script>
  </body>
</html>
